general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.75
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 72
    font_family = Inter
    color = rgb(ffffff)

    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 260, 55

    outline_thickness = 2

    outer_color = rgb(555555)
    inner_color = rgb(202020)
    font_color = rgb(ffffff)

    dots_center = true

    position = 0, -60
    halign = center
    valign = center
}
