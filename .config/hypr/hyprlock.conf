source = ~/.cache/ps3-wave-wallpaper/hyprlock-background.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 50
    font_family = JetBrains Mono
    color = rgb(c0caf5)

    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 14
    font_family = JetBrains Mono
    color = rgb(bb9af7)

    position = 0, 85
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 260, 55

    outline_thickness = 2

    outer_color = rgb(7aa2f7)
    inner_color = rgb(24283b)
    font_color = rgb(c0caf5)
    fade_on_empty = false
    dots_center = true
    placeholder_text =
    position = 0, 0
    halign = center
    valign = center
}
