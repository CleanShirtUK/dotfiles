[monitors.home]
workspace = 1
active = true
adaptive_sync = false
serial = "S5LMQS030242"
make = "ASUSTek COMPUTER INC"
model = "PA248QV"
description = "ASUSTek COMPUTER INC PA248QV S5LMQS030242"
mode = "1920x1200@74.93"
position = "-71x-4"
scale = 1
# Prefer stable EDID identity fields when available. The connector is the
# machine-specific fallback for this installation.
connector = "DP-1"

[monitors.gaming]
workspace = 6
active = true
adaptive_sync = false
serial = "R5LMTF198825"
make = "ASUSTek COMPUTER INC"
model = "ASUS VG249"
description = "ASUSTek COMPUTER INC ASUS VG249 R5LMTF198825"
mode = "1920x1080@120.00"
position = "1851x-4"
scale = 1
connector = "HDMI-A-1"

[theme]
palette = "catppuccin-mocha"

[wallpaper]
mode = "shader"

[input]
# Hyprland focus follows the pointer only when explicitly requested by a bind.
# Keep this in Orbit settings so the input policy survives config regeneration.
follow_mouse = 2

[display_profiles."DP-1"]
connector = "DP-1"
width = 1920
height = 1200
refresh_rate = 74.93
x = -71
y = -4
active = true
adaptive_sync = false

[display_profiles."HDMI-A-1"]
connector = "HDMI-A-1"
width = 1920
height = 1080
refresh_rate = 120
x = 1851
y = -4
active = true
adaptive_sync = false

[appearance.style]
button_shape = "rounded"
corner_radius = 10

[appearance.transparency]
active_opacity = 1.0
inactive_opacity = 0.95
shell_opacity = 0.30

[appearance.effects]
hyprglass_enabled = true
hyprglass_blur_type = "glass"
hyprwindowshade_enabled = true
animations_enabled = true

[appearance.effects.animations.global]
enabled = true
speed = 10.0
type = "default"

[appearance.effects.animations.windows]
enabled = true
speed = 2.9
type = "slide"

[appearance.effects.animations.fades]
enabled = true
speed = 1.5
type = "fade"

[appearance.effects.animations.layers]
enabled = true
speed = 3.81
type = "fade"

[appearance.effects.animations.workspaces]
enabled = true
speed = 2.0
type = "slidefadevert"

[appearance.effects.animations.movement]
enabled = true
speed = 2.85
type = "slide"
